"""
Used to declare that a type definition is only available in non-production environments (e.g. dev, qal, e2e)
"""
directive @preprod on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"""
Used to declare that a type definition is only available in the One Intuit schema
"""
directive @oneIntuitOnly on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"""
Used to declare that a type definition is only available in the subgraph schema
"""
directive @subgraph on SCALAR | OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT

directive @inherits(type: String!, ignoreFields: [String]) on OBJECT | INPUT_OBJECT | ENUM | INTERFACE

"""
This directive may be specified on field definitions for fields of type String, where the value will be an opaque string
and the capability exists for producing a localized human readable label for the opaque values of the field may have.

Processing of this directive will result in the field having a `format` argument declared of type `OpaqueStringFormat`
that will allow the desired string format to be specified by the operation. Applying this directive to a field that
is not a String or already has a `format` argument will result in an error in schema creation.

This is a schema directive and should be pre-processed and omitted from the exposed schema.
"""
directive @formattedKey(labelResolution: FormattedKeyLabelResolution = UNSPECIFIED) on FIELD_DEFINITION

