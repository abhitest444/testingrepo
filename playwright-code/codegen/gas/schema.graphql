  compositeContributionType(
    """
    Specify the desired format for the String value, either the opaque string value or a human readable localized label.
    """
    format: Payroll_KeyFormat = VALUE
  ): String

  """Employee's contribution to this deduction"""
  employeeContribution: EmployeeContribution

  """Company's contribution to this deduction"""
  employerContribution: EmployerContribution

  """
  The list of reasons the contribution is not in compliance for the agency
  """
  messages: [TaxDeductionPolicyMessage!]!

  """Maximum percentage required rules for this deduction"""
  maxPercentageRequiredRules: [MaxPercentageRequiredRules]
}

