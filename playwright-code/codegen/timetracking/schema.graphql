    """
    workerType: String!
}

"""
Entity type for read tracking watermarks.
"""
enum TimeTracking_ReadTrackingEntityType @tag(name: "qb") {
    """
    Feed-level: tracks which top-level posts in a project have been seen.
    """
    PROJECT

    """
    Post-level: tracks which replies in a specific post have been seen.
    """
    POST

    """
    All-level: marks the project feed AND all individual post reply threads as read.
    entityId must be the project ID. Maps to TSheets entityType=project_all.
    """
    ALL
}

