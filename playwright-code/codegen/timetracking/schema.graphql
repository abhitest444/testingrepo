"""
Type of geofence flag — indicates the location-related exception detected.
"""
enum TimeTracking_FlagType @tag(name: "qb") {
    """Worker's GPS point was outside the job's geofence."""
    LEFT_GEOFENCE

    """Device GPS was spoofed."""
    MOCKED_LOCATION

    """Worker had location sharing disabled."""
    LOCATION_NOT_SHARED

    """Device battery saver was active."""
    BATTERY_SAVER_ENABLED
}

"""
Type of entity a flag can be linked to.
"""
enum TimeTracking_FlagEntityType @tag(name: "qb") {
    """Flag is linked to a time entry."""
    TIME_ENTRY

    """Flag is linked to a GPS location point."""
    LOCATION_POINT
}

"""
A geofence flag representing a location-related exception.

Flags are created when GPS-based conditions are violated (e.g., worker leaves
geofence, mocked location detected). A flag can be linked to time entries
and/or location points via flag maps.
"""
type TimeTracking_Flag @tag(name: "qb") {
    """Unique identifier for flags"""
    id: ID!

    """Classification of the flag owner entity type (EMPLOYEE or VENDOR)."""
    timeForType: TimeTracking_TimeForType!

    """Worker reference on the flag record for DAS auto-stitching. Supergraph resolves this to the full Contact (Vendor/Employee) who owns the flag."""
    timeForContactDAS: DataAccess_Contact!

    """Type of geofence exception detected."""
    flagType: TimeTracking_FlagType!

    """Timestamp when the flag condition was detected."""
    flagTime: DateTime

    """Worker-entered explanation for the flag."""
    note: String
}

"""
An association linking a flag to a specific entity (time entry or location point).
"""
type TimeTracking_FlagMap @tag(name: "qb") {
    """Unique identifier for the mapping of flag to entity"""
    id: ID!

    """ID of the associated flag."""
    flagId: ID!

    """Classification of the flag owner entity type (EMPLOYEE/VENDOR/QBO_USER)."""
    timeForType: TimeTracking_TimeForType

    """Worker reference on the flag-map record for DAS auto-stitching. Supergraph resolves this to the full Contact (Vendor/Employee) associated with this flag mapping."""
    timeForContactDAS: DataAccess_Contact

    """Type of linked entity."""
    entityType: TimeTracking_FlagEntityType!

    """ID of the linked entity (time entry ID or location point ID)."""
    entityId: ID!

    """Whether this association is active (false = archived)."""
    isActive: Boolean!
}

