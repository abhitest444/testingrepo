"""
An errorType is a fairly coarse characterization of an error that should be sufficient for client side branching logic.
"""
enum Common_ErrorType @tag(name: "common") {
    """
    This error may be returned, for example, when an error code received from another address space
    belongs to an error space that is not known in this address space.
    Errors raised by APIs that do not return enough error information may also be converted to this error.
    If a client sees an errorType that is not known to it, it will be interpreted as UNKNOWN.
    Unknown errors must not trigger any special behavior.
    They may be treated by an implementation as being equivalent to INTERNAL.

    520 Unknown Error
    """
    UNKNOWN
    """
    This indicates a problem with the request.
    Retrying the same request is not likely to succeed.
    An example would be a query or argument that cannot be deserialized.

    400 Bad Request
    """
    BAD_REQUEST
    """
    The operation was rejected because the system is not in a state required for the operation’s execution.
    For example, the directory to be deleted is non-empty, an rmdir operation is applied to a non-directory,
    etc. Use UNAVAILABLE instead if the client can retry just the failing call without waiting for
    the system state to be explicitly fixed.

    400 Bad Request, or 500 Internal Server Error
    """
    FAILED_PRECONDITION
    """
    This indicates that an unexpected internal error was encountered:
    some invariants expected by the underlying system have been broken.
    This error code is reserved for serious errors.

    500 Internal Server Error
    """
    INTERNAL
    """
    This could apply to a resource that has never existed (e.g. bad resource id),
    or a resource that no longer exists (e.g. cache expired).
    Note to server developers: if a request is denied for an entire class of users,
    such as gradual feature rollout or undocumented allowlist, NOT_FOUND may be used.
    If a request is denied for some users within a class of users, such as user-based access control, PERMISSION_DENIED must be used.

    404 Not Found
    """
    NOT_FOUND
    """
    This indicates that the requester does not have permission to execute the specified operation.
    PERMISSION_DENIED must not be used for rejections caused by exhausting some resource or quota.
    PERMISSION_DENIED must not be used if the caller cannot be identified (use UNAUTHENTICATED instead for those errors).
    This error does not imply that the request is valid or the requested entity exists or satisfies other pre-conditions.

    403 Forbidden
    """
    PERMISSION_DENIED
    """
    This indicates that the request does not have valid authentication credentials but the route requires authentication.

    401 Unauthorized
    """
    UNAUTHENTICATED
    """
    This indicates that the service is currently unavailable.
    This is most likely a transient condition, which can be corrected by retrying with a backoff.

    503 Unavailable
    """
    UNAVAILABLE
}

"""
Error unions are great because they let clients see right away what could happen when querying or mutating a resource.
However, a union type makes it harder to evolve our schema with new types of errors.
For this reason, if you use unions for your errors/statuses, make sure that they all implement a common interface,
so that clients always have a fallback to the interface contract to handle any new errors/statuses that get introduced.

mutation {
    createProduct(input: {}) {
        product { id }
        createProductErrors {
            # Specific cases
            ... on ProductNameTaken {
                errorCode
                message
                suggestion ## This is something that is unique to this particular error type
            }
            # Interface contract (fallback)
            ... on ProductError {
                errorCode
                message
            }
        }
    }
}
"""
interface Common_ErrorResponse {
