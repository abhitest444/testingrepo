"""
Error format as defined in GraphQL Spec
"""
interface Common_Error @tag(name: "common") {
    """
    Contains text description of error condiitons
    """
    message: String!
    """
    An array of code locations, where each location is a map with the keys line and column,
    both natural numbers starting from 1 that describes the beginning of an associated syntax element
    """
    locations: [Common_Location]
    """
    If the error is associated with one of more particular fields in the response,
    this field of the error details the paths of those response fields that experienced the error.
    This helps the API consumers to identify whether a null result is intentional or caused by a runtime error
    """
    path: [ErrorPathElement!]
    """
    Contains additonal exception information as defined in
    https://github.intuit.com/pages/intuit-one-api/one-api-standards-governance/#/GraphQL/graphql-guidelines?id=_62-use-error-extensions-to-encode-additional-information-for-errors-portion-of-the-response
    """
    extensions: Common_ErrorExtension
}

"""
The GraphQL specification provides minimal guidance of the error structure.
The only required field is a message String. We have defined a stronger, more detailed contract for errors.
Use extensions to add more information to errors.
This will avoid otherwise potential naming conflicts as the GraphQL error specification evolves.
"""
interface Common_ErrorExtension @tag(name: "common") {
    """
    An enumerated error code that is meant as a fairly coarse characterization of an error akin to a status code.
    """
    errorType: Common_ErrorType!
    """
    Concise, human-readable string (e.g. TRANSPORT_LAYER) that operates as a namespace for any related errorCodes that are defined.
    Pairing the errorCategory and errorCode will result in a globally unique error for the API.
    If you have errors that are specific to your domain, use your domain's namespace as the category.
    If this is a common error, utilize a well-known category like TRANSPORT_LAYER,
    but register the errorCode that you plan to use in the centralized repository where this is tracked (link TBD - see API Stewards).
    """
    errorCategory: String
    """
    Concise, human-readable string (e.g. TOO_MANY_REQUESTS).
    Could be used as a key for localization purposes (this is unique within its errorCategory).
    """
    errorCode: String
    """
    The ErrorDetail is an optional field which will provide more fine grained information on the error condition.
    It's a human-readable string / sentence / explanation.
    It should NOT be used for localization purposes.
    It may be directly displayed to customer when no localization message exists on the client.
    """
    errorDetail: String
    """
    Indicates the source that issued the error.
    For example, could be a backend service name, a domain graph service name, or a gateway.
    In the case of client code throwing the error, this may be a client library name, or the client app name.
    """
    origin: String
    """
    Optionally provided based on request flag.
    Could include e.g. stacktrace or info from upstream service
    """
    debugInfo: String
    """
    Http URI to a page detailing additional information that could be used to debug the error.
    This information may be general to the class of error or specific to this particular instance of the error.
    """
    debugUri: String
}

"""
A map with the keys line and column, both natural numbers starting from 1 that describes the beginning of an associated syntax element
