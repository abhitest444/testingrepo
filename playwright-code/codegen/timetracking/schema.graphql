    workerType: String!
}

"""
Input for marking posts/replies as read.
"""
input TimeTracking_MarkPostsReadInput @tag(name: "qb") {
    """
    Entity type for the read watermark.
    PROJECT = mark all feed posts as read up to readTo.
    POST = mark replies of a specific post as read up to readTo.
    """
    entityType: TimeTracking_ReadTrackingEntityType!

    """
    Entity ID: project ID (when entityType=PROJECT) or post ID (when entityType=POST).
    """
    entityId: ID!

